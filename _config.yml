# Build settings
markdown:           kramdown
paginate:           5
paginate_path:      "/posts/page:num/"
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap ## Uncomment this line to silently generate a sitemaps.org compliant sitemap for your Jekyll site

asciidoc: {}
asciidoctor:
  base_dir: :docdir
  safe: unsafe
  attributes:
    - idseparator=_
    - source-highlighter=rouge

collections:
  conferences:
    output: true
    permalink: /conferences/:year/:month/:day/:title
  courses:
    output: true
    permalink: /courses/:year/:month/:day/:title

# The vendored Bootstrap 4 / Clean Blog Sass predates the current Dart Sass syntax
sass:
  silence_deprecations: [import, global-builtin, color-functions]
